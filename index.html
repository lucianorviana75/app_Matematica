<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Geométrica</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .subtitle {
            color: #8d8d99;
            font-size: 15px;
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: #202024;
            color: #c4c4cc;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background-color: #29292e;
        }

        .tab-btn.active {
            background-color: #1d4ed8;
            color: #ffffff;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .visualizer-card {
            background-color: #18181b;
            border-radius: 12px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid #27272a;
            overflow: hidden;
        }

        /* Elemento dinâmico da figura */
        .shape-preview {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.1s ease-out;
        }

        .stats-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .metrics-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .metric-card {
            background-color: #18181b;
            border-radius: 10px;
            padding: 16px;
            border: 1px solid #27272a;
        }

        .metric-title {
            color: #a1a1aa;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 22px;
            font-weight: 600;
            font-family: monospace;
            color: #ffffff;
        }

        .formulas-card {
            background-color: #18181b;
            border-radius: 10px;
            padding: 18px;
            border: 1px solid #27272a;
            flex-grow: 1;
        }

        .formulas-title {
            color: #a1a1aa;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .formula-line {
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 10px;
            color: #e4e4e7;
        }

        .formula-line span.highlight {
            color: #60a5fa;
            font-weight: bold;
        }

        .controls-card {
            background-color: #18181b;
            border-radius: 12px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid #27272a;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .control-label {
            font-size: 15px;
            color: #ffffff;
            width: 130px;
        }

        .slider-container {
            flex-grow: 1;
            margin: 0 20px;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: #27272a;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

        .value-display {
            font-size: 16px;
            font-weight: 500;
            font-family: monospace;
            width: 65px;
            text-align: right;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora Geométrica</h1>
    <p class="subtitle">Explore dimensões, fórmulas e propriedades de figuras 2D e 3D em tempo real.</p>

    <!-- Botões para selecionar a figura -->
    <div class="tabs">
        <button class="tab-btn active" onclick="selectShape('circulo')">Círculo</button>
        <button class="tab-btn" onclick="selectShape('retangulo')">Retângulo</button>
        <button class="tab-btn" onclick="selectShape('triangulo')">Triângulo Retângulo</button>
        <button class="tab-btn" onclick="selectShape('esfera')">Esfera</button>
        <button class="tab-btn" onclick="selectShape('cilindro')">Cilindro</button>
    </div>

    <div class="main-grid">
        <div class="visualizer-card">
            <div class="shape-preview" id="shape"></div>
        </div>

        <div class="stats-panel">
            <div class="metrics-row">
                <div class="metric-card">
                    <div class="metric-title" id="m1-title">Área (A)</div>
                    <div class="metric-value" id="m1-val">0 cm²</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title" id="m2-title">Circunferência (C)</div>
                    <div class="metric-value" id="m2-val">0 cm</div>
                </div>
            </div>

            <div class="formulas-card">
                <div class="formulas-title">FÓRMULAS E CÁLCULO</div>
                <div class="formula-line" id="formula-1"></div>
                <div class="formula-line" id="formula-2"></div>
            </div>
        </div>
    </div>

    <!-- Controlos de dimensão dinâmicos -->
    <div class="controls-card" id="controls-container"></div>
</div>

<script>
    let currentShape = 'circulo';
    
    // Parâmetros guardados
    const values = {
        raio: 5,
        largura: 6,
        altura: 4
    };

    function selectShape(shapeType) {
        currentShape = shapeType;
        
        // Atualiza estilo dos botões
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        
        const indexMap = { circulo: 0, retangulo: 1, triangulo: 2, esfera: 3, cilindro: 4 };
        buttons[indexMap[shapeType]].classList.add('active');

        renderControls();
        updateCalculations();
    }

    function renderControls() {
        const container = document.getElementById('controls-container');
        container.innerHTML = '';

        if (['circulo', 'esfera'].includes(currentShape)) {
            container.appendChild(createSlider('Raio (r)', 'raio', 1, 10, values.raio));
        } else if (currentShape === 'retangulo') {
            container.appendChild(createSlider('Largura (l)', 'largura', 1, 10, values.largura));
            container.appendChild(createSlider('Altura (h)', 'altura', 1, 10, values.altura));
        } else if (currentShape === 'triangulo') {
            container.appendChild(createSlider('Base (b)', 'largura', 1, 10, values.largura));
            container.appendChild(createSlider('Altura (h)', 'altura', 1, 10, values.altura));
        } else if (currentShape === 'cilindro') {
            container.appendChild(createSlider('Raio (r)', 'raio', 1, 10, values.raio));
            container.appendChild(createSlider('Altura (h)', 'altura', 1, 10, values.altura));
        }
    }

    function createSlider(label, key, min, max, val) {
        const group = document.createElement('div');
        group.className = 'control-group';
        group.innerHTML = `
            <div class="control-label">${label}</div>
            <div class="slider-container">
                <input type="range" min="${min}" max="${max}" value="${val}" step="0.1" oninput="updateValue('${key}', this.value)">
            </div>
            <div class="value-display">${val} cm</div>
        `;
        return group;
    }

    function updateValue(key, val) {
        values[key] = parseFloat(val);
        renderControls();
        updateCalculations();
    }

    function updateCalculations() {
        const shapeEl = document.getElementById('shape');
        const m1Title = document.getElementById('m1-title');
        const m2Title = document.getElementById('m2-title');
        const m1Val = document.getElementById('m1-val');
        const m2Val = document.getElementById('m2-val');
        const f1 = document.getElementById('formula-1');
        const f2 = document.getElementById('formula-2');

        const { raio: r, largura: l, altura: h } = values;

        if (currentShape === 'circulo') {
            const area = (Math.PI * r * r).toFixed(2).replace('.', ',');
            const circ = (2 * Math.PI * r).toFixed(2).replace('.', ',');

            m1Title.textContent = 'Área (A)';
            m2Title.textContent = 'Circunferência (C)';
            m1Val.textContent = `${area} cm²`;
            m2Val.textContent = `${circ} cm`;

            f1.innerHTML = `<span class="highlight">A = π · r²</span> = π · ${r}² ≈ ${area} cm²`;
            f2.innerHTML = `<span class="highlight">C = 2 · π · r</span> = 2 · π · ${r} ≈ ${circ} cm`;

            const px = r * 22;
            shapeEl.style = `width: ${px}px; height: ${px}px; background-color: #000; border-radius: 50%;`;
        } 
        else if (currentShape === 'retangulo') {
            const area = (l * h).toFixed(2).replace('.', ',');
            const perim = (2 * (l + h)).toFixed(2).replace('.', ',');

            m1Title.textContent = 'Área (A)';
            m2Title.textContent = 'Perímetro (P)';
            m1Val.textContent = `${area} cm²`;
            m2Val.textContent = `${perim} cm`;

            f1.innerHTML = `<span class="highlight">A = b · h</span> = ${l} · ${h} = ${area} cm²`;
            f2.innerHTML = `<span class="highlight">P = 2 · (b + h)</span> = 2 · (${l} + ${h}) = ${perim} cm`;

            shapeEl.style = `width: ${l * 20}px; height: ${h * 20}px; background-color: #1d4ed8; border-radius: 4px;`;
        } 
        else if (currentShape === 'triangulo') {
            const area = ((l * h) / 2).toFixed(2).replace('.', ',');
            const hip = Math.sqrt(l * l + h * h).toFixed(2).replace('.', ',');

            m1Title.textContent = 'Área (A)';
            m2Title.textContent = 'Hipotenusa (c)';
            m1Val.textContent = `${area} cm²`;
            m2Val.textContent = `${hip} cm`;

            f1.innerHTML = `<span class="highlight">A = (b · h) / 2</span> = (${l} · ${h}) / 2 = ${area} cm²`;
            f2.innerHTML = `<span class="highlight">c = √(b² + h²)</span> = √(${l}² + ${h}²) ≈ ${hip} cm`;

            shapeEl.style = `width: 0; height: 0; border-bottom: ${h * 20}px solid #16a34a; border-left: ${l * 20}px solid transparent;`;
        } 
        else if (currentShape === 'esfera') {
            const vol = ((4 / 3) * Math.PI * Math.pow(r, 3)).toFixed(2).replace('.', ',');
            const area = (4 * Math.PI * r * r).toFixed(2).replace('.', ',');

            m1Title.textContent = 'Volume (V)';
            m2Title.textContent = 'Área Superficial';
            m1Val.textContent = `${vol} cm³`;
            m2Val.textContent = `${area} cm²`;

            f1.innerHTML = `<span class="highlight">V = (4/3) · π · r³</span> = (4/3) · π · ${r}³ ≈ ${vol} cm³`;
            f2.innerHTML = `<span class="highlight">A = 4 · π · r²</span> = 4 · π · ${r}² ≈ ${area} cm²`;

            const px = r * 22;
            shapeEl.style = `width: ${px}px; height: ${px}px; background: radial-gradient(circle at 30% 30%, #60a5fa, #000); border-radius: 50%;`;
        } 
        else if (currentShape === 'cilindro') {
            const vol = (Math.PI * r * r * h).toFixed(2).replace('.', ',');
            const area = (2 * Math.PI * r * (r + h)).toFixed(2).replace('.', ',');

            m1Title.textContent = 'Volume (V)';
            m2Title.textContent = 'Área Superficial';
            m1Val.textContent = `${vol} cm³`;
            m2Val.textContent = `${area} cm²`;

            f1.innerHTML = `<span class="highlight">V = π · r² · h</span> = π · ${r}² · ${h} ≈ ${vol} cm³`;
            f2.innerHTML = `<span class="highlight">A = 2·π·r·(r + h)</span> = 2·π·${r}·(${r}+${h}) ≈ ${area} cm²`;

            shapeEl.style = `width: ${r * 20}px; height: ${h * 20}px; background: linear-gradient(90deg, #2563eb, #60a5fa, #1d4ed8); border-radius: 10px;`;
        }
    }

    // Inicializar no carregamento
    selectShape('circulo');
</script>

</body>
</html>
